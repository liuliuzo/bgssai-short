# bgssai-short-admin — prod profile (application-prod.properties)
# 与 application-dev/-test/-prod.properties 保持完全一致的 key 集合，仅 value 随环境变化
# （Standards §1：分环境硬编码真实字面量，禁用属性占位符表达式）。
# 启动：SPRING_PROFILES_ACTIVE=prod（或 --spring.profiles.active=prod）。
# 本文件不含占位符，按 Standards §1 全部写死本环境最终字面量并随 jar 打包，**无一项留空**：
# 数据源、jwt.secret、SSL keystore 口令均随 jar 走，服务器上不需要放任何配置文件即可起服。
# application-secrets.properties 注入机制已停用（见 deploy/README.md 与 docs/security/secrets-checklist.md）。
# jwt.secret 留空时 JwtUtil 启动期 fail-fast；本档已用 openssl rand -base64 48 生成真实值，与 dev / test 及用户端不复用。
#
# 生产管理端与 EMQX-MQTT-境内共机（121.37.142.152 / 私有 172.31.1.81，admin.bgssai-short.com）。
# EMQX 占用 1883/8883/8083/18083，不占 80/443。
#
# 已上移至 application.properties 主配置（三环境不变量）：spring.datasource.type

# --- 端口 / SSL（prod 管理端域名 admin.bgssai-short.com + IP 均可 HTTPS 443；HTTP 80 跳转）---
server.port=443
server.http.port=80
server.ssl.enabled=true
server.ssl.key-store=classpath:admin.bgssai-short.com.jks
server.ssl.key-store-type=JKS
server.ssl.key-store-password=Jn9^SSmDbpz@VxvZ

# 分机部署：HTTPS 443 + HTTP 80 跳转（SslConfig）。证书为 classpath 内置 JKS，口令见上方 server.ssl.key-store-password。

# --- 日志 ---
logging.config=classpath:log/logback-spring_file.xml
logging.applog.path=/opt/bgssai/log

# --- 数据源连接 (spring.datasource.*) ---
# 境内生产库 172.31.4.181（VPC 私有地址，公网 121.36.230.185；两端共用同一个库 bgssai_short）。
spring.datasource.url=jdbc:mysql://172.31.4.181:3306/bgssai_short?useSSL=false&serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=2aB?fG9*nL

# --- JWT ---
# 按 Standards §1 写死本环境最终字面量（openssl rand -base64 48 生成，与 dev / test 及用户端不复用）。
# 留空或不足 32 字符会在 JwtUtil.configure 抛 IllegalStateException 使启动失败。
jwt.secret=nESBAHiYIDIO0Photdfll1TBCfsX13FJ1inGqT_pOeozNDVI_2ISrtRRkWruGBvR
jwt.expiration-ms=86400000

# --- CORS ---
bgssai.cors.allowed-origins=https://admin.bgssai-short.com
