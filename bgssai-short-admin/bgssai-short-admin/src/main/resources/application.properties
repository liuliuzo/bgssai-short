spring.application.name=bgssai-short-admin

spring.profiles.active=dev

# server.port / server.http.port / server.ssl.* 按环境写在 application-<profile>.properties
# （分机部署：管理端与用户端各自独立主机，同用标准 Web 80 与 SSL 443，见 SslConfig）。

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/plain,text/css,application/x-javascript

mybatis.mapper-locations=classpath:mybatis/mapper/*.xml
mybatis.configuration.map-underscore-to-camel-case=true

# 数据源三环境不变量（按 Standards §1 归入主配置）；连接串 / 账号 / 密码 / 池大小等随环境项见 application-<profile>.properties。
spring.datasource.type=com.alibaba.druid.pool.DruidDataSource

# 健康检查阈值（三环境不变量，按 Standards §1 归入主配置；统一方案与契约见 Standards §13
# 与 docs/api/health-check.md）。全产品线共用 bgssai.health.* 前缀，不得改成产品私有前缀。
bgssai.health.cache-ttl-ms=2000
bgssai.health.probe-timeout-ms=2000
bgssai.health.db-validation-timeout-seconds=2
bgssai.health.pool-active-threshold-percent=90
bgssai.health.heap-used-threshold-percent=90
bgssai.health.disk-free-threshold-mb=512
