<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>MCP 服务流程 — bgssai-short architecture</title>
<style>
  :root { --bg:#fafafa; --fg:#1a1a1a; --muted:#6b7280; --accent:#2563eb; --line:#d1d5db; --box:#fff; --font: ui-monospace, Consolas, monospace; }
  body { background:var(--bg); color:var(--fg); font-family:var(--font); margin:0; padding:24px; line-height:1.5; }
  h1 { font-size:18px; margin:0 0 8px; }
  .meta { font-size:12px; color:var(--muted); margin-bottom:24px; border-left:3px solid var(--accent); padding-left:12px; }
  svg { background:var(--box); border:1px solid var(--line); border-radius:4px; }
  svg text { font-family:var(--font); fill:var(--fg); font-size:12px; }
  svg .box { fill:var(--box); stroke:#374151; stroke-width:1.5; }
  svg .arr { stroke:var(--fg); stroke-width:1.5; fill:none; marker-end:url(#arrow); }
</style>
</head>
<body>
<h1>MCP 调用链</h1>
<div class="meta">用户端 PAT → /api/mcp → UserContext(user_id) → 既有只读 Service</div>
<svg width="920" height="160" viewBox="0 0 920 160">
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a1a"/></marker></defs>
  <rect class="box" x="20" y="50" width="140" height="50" rx="4"/><text x="90" y="80" text-anchor="middle">AI 客户端</text>
  <path class="arr" d="M170 75 L230 75"/>
  <rect class="box" x="240" y="50" width="160" height="50" rx="4"/><text x="320" y="80" text-anchor="middle">POST /api/mcp</text>
  <path class="arr" d="M410 75 L470 75"/>
  <rect class="box" x="480" y="50" width="180" height="50" rx="4"/><text x="570" y="80" text-anchor="middle">McpProtocolService</text>
  <path class="arr" d="M670 75 L730 75"/>
  <rect class="box" x="740" y="50" width="160" height="50" rx="4"/><text x="820" y="80" text-anchor="middle">既有 Service</text>
</svg>
<p style="font-size:12px;color:#6b7280">MCP Connectors 页（tagline: Connect your AI tools to bgssai）引导 Claude / Codex / Cursor / Grok Bot / bgssai-bot。令牌管理走 JWT：POST /api/mcp/tokens/create|list|revoke。MCP 工具仅登录日志与健康探针，不发明短剧领域能力。</p>
</body>
</html>
