<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>短剧制作全链路管线 — bgssai short feature</title>
<style>
  :root {
    --bg: #fafafa; --fg: #1a1a1a; --muted: #6b7280; --accent: #2563eb;
    --warn: #d97706; --ok: #059669; --err: #dc2626; --line: #d1d5db;
    --box-fill: #ffffff; --box-stroke: #374151;
    --font: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body { background: var(--bg); color: var(--fg); font-family: var(--font); margin: 0; padding: 24px; line-height: 1.5; }
  h1 { font-size: 18px; margin: 0 0 8px; }
  h2 { font-size: 14px; margin: 28px 0 8px; }
  .meta { font-size: 12px; color: var(--muted); margin-bottom: 24px; border-left: 3px solid var(--accent); padding-left: 12px; }
  .meta dt { font-weight: bold; display: inline; }
  .meta dd { display: inline; margin: 0 16px 0 4px; }
  svg { background: var(--box-fill); border: 1px solid var(--line); border-radius: 4px; max-width: 100%; }
  .note { font-size: 12px; color: var(--muted); margin-top: 16px; max-width: 900px; }
  svg text { font-family: var(--font); fill: var(--fg); }
  svg .box { fill: var(--box-fill); stroke: var(--box-stroke); stroke-width: 1.5; }
  svg .pain { fill: #fef2f2; stroke: var(--err); stroke-width: 1.2; }
  svg .cure { fill: #eff6ff; stroke: var(--accent); stroke-width: 1.2; }
  svg .arr { stroke: var(--fg); stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
  svg .lbl { font-size: 12px; }
  svg .small { font-size: 10px; fill: var(--muted); }
  svg .accent { stroke: var(--accent); color: var(--accent); }
  svg .err { stroke: var(--err); color: var(--err); }
</style>
</head>
<body>

<h1>短剧制作全链路管线：痛点、对应功能与状态推进</h1>
<dl class="meta">

  <dt>关联</dt><dd>short-work-management.md 及其余全部功能文档</dd>
  <dt>更新</dt><dd>2026-08-13</dd>
</dl>

<h2>二、作品状态自动推进（取全部剧集中进度最靠前的阶段）</h2>
<svg viewBox="0 0 1080 150" width="1080" height="150">
  <rect class="box" x="20"  y="40" width="120" height="46" rx="6"/>
  <text class="lbl" x="80"  y="62" text-anchor="middle">DRAFT</text>
  <text class="small" x="80" y="78" text-anchor="middle">草稿</text>

  <rect class="box" x="180" y="40" width="120" height="46" rx="6"/>
  <text class="lbl" x="240" y="62" text-anchor="middle">SCRIPTING</text>
  <text class="small" x="240" y="78" text-anchor="middle">剧本中</text>

  <rect class="box" x="340" y="40" width="120" height="46" rx="6"/>
  <text class="lbl" x="400" y="62" text-anchor="middle">PRODUCING</text>
  <text class="small" x="400" y="78" text-anchor="middle">制作中</text>

  <rect class="box" x="500" y="40" width="120" height="46" rx="6"/>
  <text class="lbl" x="560" y="62" text-anchor="middle">COMPOSING</text>
  <text class="small" x="560" y="78" text-anchor="middle">合成中</text>

  <rect class="box" x="660" y="40" width="120" height="46" rx="6"/>
  <text class="lbl" x="720" y="62" text-anchor="middle">REVIEWING</text>
  <text class="small" x="720" y="78" text-anchor="middle">审核中</text>

  <rect class="box" x="820" y="40" width="120" height="46" rx="6"/>
  <text class="lbl" x="880" y="62" text-anchor="middle">COMPLETED</text>
  <text class="small" x="880" y="78" text-anchor="middle">已完成</text>

  <rect class="box" x="960" y="40" width="100" height="46" rx="6"/>
  <text class="lbl" x="1010" y="62" text-anchor="middle">ARCHIVED</text>
  <text class="small" x="1010" y="78" text-anchor="middle">已归档</text>

  <path class="arr accent" d="M 140 63 L 180 63"/>
  <path class="arr accent" d="M 300 63 L 340 63"/>
  <path class="arr accent" d="M 460 63 L 500 63"/>
  <path class="arr accent" d="M 620 63 L 660 63"/>
  <path class="arr accent" d="M 780 63 L 820 63"/>
  <path class="arr" d="M 940 63 L 960 63"/>
  <text class="small" x="1010" y="112" text-anchor="middle">手工归档 / 恢复</text>
  <text class="small" x="440" y="118" text-anchor="middle">前六态由下游产出自动推进，不提供手工改状态入口；ARCHIVED 为唯一手工态，恢复后回到归档前状态。</text>
</svg>

<p class="note">
  阅读顺序：第一张图从上到下三行分别是「阶段 / 创作者原有痛点 / 本产品的解法」，同一列上下对应。
  管线是单向的，但允许回流——任一上游产出变更会让下游状态回落（剧本改动使分镜回落 DRAFT，
  镜头重抽使成片过期并回落审核状态），回落规则见各功能文档第五节。
</p>
