<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>管理端登录密码可见切换</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 24px; color: #0f172a; }
    .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin: 12px 0; }
    .box { border: 1px solid #cbd5e1; border-radius: 8px; padding: 10px 14px; background: #f8fafc; }
    .arrow { color: #2563eb; font-weight: 700; }
  </style>
</head>
<body>
  <h1>管理端登录密码可见切换</h1>
  <div class="row">
    <div class="box">进入登录页</div>
    <div class="arrow">→</div>
    <div class="box">密码框掩码（默认）</div>
    <div class="arrow">→</div>
    <div class="box">点击「显示密码」</div>
    <div class="arrow">→</div>
    <div class="box">明文</div>
    <div class="arrow">→</div>
    <div class="box">点击「隐藏密码」</div>
    <div class="arrow">→</div>
    <div class="box">恢复掩码</div>
  </div>
  <div class="row">
    <div class="box">登录按钮</div>
    <div class="arrow">→</div>
    <div class="box">POST /bgssai/admin/login（请求体不变）</div>
  </div>
</body>
</html>
