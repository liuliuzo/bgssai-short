<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>站内在线客服 — 流程</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 24px; color: #1a1a1a; }
    h1 { font-size: 20px; }
    .lane { border: 1px solid #d0d7de; border-radius: 8px; padding: 12px 16px; margin: 12px 0; }
    .lane h2 { font-size: 14px; margin: 0 0 8px; color: #0969da; }
    .steps { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .box { background: #f6f8fa; border: 1px solid #d0d7de; border-radius: 6px; padding: 8px 12px; font-size: 13px; }
    .arrow { color: #656d76; font-weight: 700; }
    .note { font-size: 12px; color: #656d76; margin-top: 16px; }
  </style>
</head>
<body>
  <h1>站内在线客服 · 会话流程</h1>
  <div class="lane">
    <h2>用户 / 访客</h2>
    <div class="steps">
      <div class="box">打开悬浮入口</div>
      <span class="arrow">→</span>
      <div class="box">气泡区 + 底部输入（无表单）</div>
      <span class="arrow">→</span>
      <div class="box">首条留言 create → PENDING</div>
      <span class="arrow">→</span>
      <div class="box">send / detail 看历史气泡</div>
    </div>
  </div>
  <div class="lane">
    <h2>管理端</h2>
    <div class="steps">
      <div class="box">sessions/list</div>
      <span class="arrow">→</span>
      <div class="box">detail（清未读）</div>
      <span class="arrow">→</span>
      <div class="box">reply → OPEN</div>
      <span class="arrow">→</span>
      <div class="box">close → CLOSED</div>
    </div>
  </div>
  <p class="note">访客端无必填联系方式 / 主题表单。关闭后用户再发即 create 新会话。状态枚举：OPEN / PENDING / CLOSED。</p>
</body>
</html>
