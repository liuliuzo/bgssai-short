<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>出视频步骤</title>
  <style>
    body { font-family: "Segoe UI", "Microsoft YaHei UI", sans-serif; margin: 32px; color: #1f1f1f; background: #f8fafc; }
    .panel { background: #fff; border: 1px solid #e2e8f0; border-radius: 10px; padding: 16px; max-width: 980px; }
    .head { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
    .badge { display: inline-block; padding: 4px 10px; border-radius: 999px; background: #eff6ff; border: 1px solid #93c5fd; color: #1d4ed8; font-weight: 700; font-size: 13px; }
    .aux { display: inline-block; padding: 4px 10px; border-radius: 6px; border: 1px solid #cbd5e1; color: #334155; font-size: 12px; background: #f8fafc; }
    ol { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 6px; margin: 0 0 14px; padding: 0; list-style: none; }
    li { display: flex; align-items: center; gap: 6px; }
    li::after { content: "→"; color: #94a3b8; margin-left: 4px; }
    li:last-child::after { content: ""; margin: 0; }
    .step { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 8px; border: 1px solid #e2e8f0; background: #f8fafc; font-size: 13px; color: #475569; }
    .step.done { background: #f0fdf4; border-color: #86efac; color: #166534; }
    .step.now { background: #eff6ff; border: 2px solid #1677ff; color: #1d4ed8; font-weight: 700; }
    .no { display: inline-flex; align-items: center; justify-content: center; width: 18px; height: 18px; border-radius: 999px; font-size: 11px; font-weight: 700; background: #e2e8f0; color: #475569; }
    .step.done .no { background: #16a34a; color: #fff; }
    .step.now .no { background: #1677ff; color: #fff; }
    .tag { font-size: 11px; opacity: 0.9; }
    .map { margin-top: 12px; font-size: 12px; color: #475569; }
  </style>
</head>
<body>
  <div class="panel">
    <div class="head">
      <span class="badge">当前环节：第 4/9 步 · 定妆</span>
      <span class="aux">页头收纳：辅助工具（原著 / 配音 / 预览 / 剧情 / 质量 / 连贯性 / 任务 / 剪辑）</span>
    </div>
    <ol>
      <li><span class="step done"><span class="no">1</span><span>大纲</span><span class="tag">已完成</span></span></li>
      <li><span class="step done"><span class="no">2</span><span>剧本</span><span class="tag">已完成</span></span></li>
      <li><span class="step done"><span class="no">3</span><span>定稿</span><span class="tag">已完成</span></span></li>
      <li><span class="step now"><span class="no">4</span><span>定妆</span><span class="tag">当前环节</span></span></li>
      <li><span class="step"><span class="no">5</span><span>场景</span><span class="tag">未开始</span></span></li>
      <li><span class="step"><span class="no">6</span><span>拆镜</span><span class="tag">未开始</span></span></li>
      <li><span class="step"><span class="no">7</span><span>首帧</span><span class="tag">未开始</span></span></li>
      <li><span class="step"><span class="no">8</span><span>视频</span><span class="tag">未开始</span></span></li>
      <li><span class="step"><span class="no">9</span><span>成片</span><span class="tag">未开始</span></span></li>
    </ol>
    <div class="map">路由映射：1-3 → script · 4 → characters · 5 → scenes · 6-8 → storyboard · 9 → compose</div>
  </div>
</body>
</html>
