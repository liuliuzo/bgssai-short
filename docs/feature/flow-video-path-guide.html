<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>出视频步骤</title>
  <style>
    body { font-family: "Segoe UI", "Microsoft YaHei UI", sans-serif; margin: 32px; color: #1f1f1f; }
    ol { display: flex; flex-wrap: wrap; gap: 8px 0; padding: 0; list-style: none; }
    li { display: flex; align-items: center; }
    li::after { content: "→"; margin: 0 10px; color: #8c8c8c; }
    li:last-child::after { content: ""; margin: 0; }
    .now { color: #0d6efd; font-weight: 700; }
    p { max-width: 640px; line-height: 1.6; }
  </style>
</head>
<body>
  <h1>出视频步骤</h1>
  <p>作品页顶部只回答「这一集下一步做什么」。没做完前置条件时，不把「生成视频」当成可以点的下一步。</p>
  <ol>
    <li>大纲</li>
    <li>剧本</li>
    <li>定稿</li>
    <li class="now">定妆</li>
    <li>拆镜</li>
    <li>首帧</li>
    <li>视频</li>
    <li>成片</li>
  </ol>
  <p>示例停在定妆：角色或场景还没锁定。主按钮是「给这一张出定妆」或「锁定已有的图」。锁定之后才拆镜、出首帧、生成视频。</p>
</body>
</html>
