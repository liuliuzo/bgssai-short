<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>中文产品 /en 入口</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 24px; color: #0f172a; }
    .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin: 12px 0; }
    .box { border: 1px solid #cbd5e1; border-radius: 8px; padding: 10px 14px; background: #f8fafc; }
    .arrow { color: #2563eb; font-weight: 700; }
  </style>
</head>
<body>
  <h1>中文产品 /en 入口</h1>
  <div class="row">
    <div class="box">/en 或 /en/*</div>
    <div class="arrow">→</div>
    <div class="box">/login（中文登录）</div>
    <div class="arrow">→</div>
    <div class="box">已登录则 /home</div>
  </div>
  <div class="row">
    <div class="box">其它未知路径</div>
    <div class="arrow">→</div>
    <div class="box">页面不存在</div>
  </div>
</body>
</html>
