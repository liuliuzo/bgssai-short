<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>AI 能力解析与计费链路 — bgssai short feature</title>
<style>
  :root { --bg:#fafafa; --fg:#1a1a1a; --muted:#6b7280; --accent:#2563eb; --warn:#d97706;
          --ok:#059669; --err:#dc2626; --line:#d1d5db; --box-fill:#ffffff; --box-stroke:#374151;
          --font: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
  * { box-sizing:border-box; }
  body { background:var(--bg); color:var(--fg); font-family:var(--font); margin:0; padding:24px; line-height:1.5; }
  h1 { font-size:18px; margin:0 0 8px; } h2 { font-size:14px; margin:28px 0 8px; }
  .meta { font-size:12px; color:var(--muted); margin-bottom:24px; border-left:3px solid var(--accent); padding-left:12px; }
  .meta dt { font-weight:bold; display:inline; } .meta dd { display:inline; margin:0 16px 0 4px; }
  svg { background:var(--box-fill); border:1px solid var(--line); border-radius:4px; max-width:100%; }
  .note { font-size:12px; color:var(--muted); margin-top:16px; max-width:900px; }
  svg text { font-family:var(--font); fill:var(--fg); }
  svg .box { fill:var(--box-fill); stroke:var(--box-stroke); stroke-width:1.5; }
  svg .cfg { fill:#eff6ff; stroke:var(--accent); stroke-width:1.2; }
  svg .done { fill:#f0fdf4; stroke:var(--ok); stroke-width:1.2; }
  svg .fail { fill:#fef2f2; stroke:var(--err); stroke-width:1.2; }
  svg .arr { stroke:var(--fg); stroke-width:1.5; fill:none; marker-end:url(#arrow); }
  svg .lbl { font-size:12px; } svg .small { font-size:10px; fill:var(--muted); }
  svg .accent { stroke:var(--accent); color:var(--accent); }
  svg .errline { stroke:var(--err); color:var(--err); }
</style>
</head>
<body>

<h1>AI 能力解析、计费与账单链路</h1>
<dl class="meta">
  <dt>作用域</dt><dd>ai_model_config 解析 / ai_usage_record 记账 / 双端账单</dd>
  <dt>关联</dt><dd>ai-capability-usage.md · shot-generation.md</dd>
  <dt>更新</dt><dd>2026-08-13</dd>
</dl>

<h2>一、业务只认能力类型，不认供应商</h2>
<svg viewBox="0 0 1040 280" width="1040" height="280">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor"/>
    </marker>
  </defs>

  <rect class="box" x="20" y="40" width="190" height="54" rx="6"/>
  <text class="lbl" x="115" y="62" text-anchor="middle">业务提交任务</text>
  <text class="small" x="115" y="80" text-anchor="middle">只传 task_type=VIDEO</text>

  <rect class="cfg" x="260" y="40" width="230" height="54" rx="6"/>
  <text class="lbl" x="375" y="62" text-anchor="middle">能力解析 ai_model_config</text>
  <text class="small" x="375" y="80" text-anchor="middle">取 enabled_flag=1 且 default_flag=1</text>

  <rect class="box" x="540" y="40" width="220" height="54" rx="6"/>
  <text class="lbl" x="650" y="62" text-anchor="middle">得到 model_code 与单价</text>
  <text class="small" x="650" y="80" text-anchor="middle">price_unit + unit_price_cent</text>

  <rect class="box" x="810" y="40" width="210" height="54" rx="6"/>
  <text class="lbl" x="915" y="62" text-anchor="middle">调用供应商执行</text>
  <text class="small" x="915" y="80" text-anchor="middle">密钥不落库明文</text>

  <path class="arr accent" d="M 210 67 L 260 67"/>
  <path class="arr accent" d="M 490 67 L 540 67"/>
  <path class="arr accent" d="M 760 67 L 810 67"/>

  <rect class="fail" x="260" y="140" width="230" height="54" rx="6"/>
  <text class="small" x="375" y="162" text-anchor="middle">组内无启用模型</text>
  <text class="small" x="375" y="180" text-anchor="middle">返回 4014 该能力当前不可用</text>
  <path class="arr errline" d="M 375 94 L 375 140"/>

  <rect class="cfg" x="540" y="140" width="480" height="54" rx="6"/>
  <text class="small" x="780" y="162" text-anchor="middle">用户可在启用模型中选质量档位 quality_level：FAST 快速 / STANDARD 标准 / HIGH 高质</text>
  <text class="small" x="780" y="180" text-anchor="middle">档位不同单价不同，estimate 接口据此返回对应预估</text>

  <rect class="box" x="20" y="220" width="1000" height="44" rx="6"/>
  <text class="small" x="520" y="240" text-anchor="middle">换供应商 / 调价 / 停用某模型：管理端改配置即可，业务代码零改动、无需发版</text>
  <text class="small" x="520" y="256" text-anchor="middle">单价变更只对变更后创建的任务生效；历史任务按 ai_usage_record 里的单价快照核算，不追溯</text>
</svg>

<h2>二、计费时机与三处金额的一致性</h2>
<svg viewBox="0 0 1040 260" width="1040" height="260">
  <rect class="done" x="20" y="40" width="200" height="50" rx="6"/>
  <text class="lbl" x="120" y="62" text-anchor="middle">任务 SUCCEEDED</text>
  <text class="small" x="120" y="78" text-anchor="middle">唯一计费触发点</text>

  <rect class="box" x="290" y="20" width="240" height="44" rx="6"/>
  <text class="small" x="410" y="40" text-anchor="middle">写 ai_usage_record 一条流水</text>
  <text class="small" x="410" y="56" text-anchor="middle">含单价快照与关联对象</text>

  <rect class="box" x="290" y="76" width="240" height="44" rx="6"/>
  <text class="small" x="410" y="96" text-anchor="middle">扣减 user_quota.balance_cent</text>
  <text class="small" x="410" y="112" text-anchor="middle">累加 month_spent_cent</text>

  <rect class="box" x="290" y="132" width="240" height="44" rx="6"/>
  <text class="small" x="410" y="152" text-anchor="middle">累加 short_work.cost_spent_cent</text>
  <text class="small" x="410" y="168" text-anchor="middle">驱动作品预算闸门</text>

  <path class="arr accent" d="M 220 60 L 290 42"/>
  <path class="arr accent" d="M 220 65 L 290 98"/>
  <path class="arr accent" d="M 220 70 L 290 154"/>

  <rect class="box" x="600" y="20" width="200" height="44" rx="6"/>
  <text class="small" x="700" y="40" text-anchor="middle">用户端账单页</text>
  <text class="small" x="700" y="56" text-anchor="middle">按作品 / 能力 / 时间聚合</text>

  <rect class="box" x="600" y="76" width="200" height="44" rx="6"/>
  <text class="small" x="700" y="96" text-anchor="middle">管理端用量运营页</text>
  <text class="small" x="700" y="112" text-anchor="middle">平台与分创作者汇总</text>

  <rect class="box" x="600" y="132" width="200" height="44" rx="6"/>
  <text class="small" x="700" y="152" text-anchor="middle">作品工作台成本条</text>
  <text class="small" x="700" y="168" text-anchor="middle">已花 / 预算占比</text>

  <path class="arr accent" d="M 530 42 L 600 42"/>
  <path class="arr accent" d="M 530 98 L 600 98"/>
  <path class="arr accent" d="M 530 154 L 600 154"/>

  <rect class="done" x="850" y="60" width="170" height="90" rx="6"/>
  <text class="small" x="935" y="86" text-anchor="middle">三处金额同源</text>
  <text class="small" x="935" y="104" text-anchor="middle">同一时间区间口径下</text>
  <text class="small" x="935" y="122" text-anchor="middle">逐分相等，可对账</text>
  <path class="arr accent" d="M 800 98 L 850 100"/>

  <rect class="fail" x="20" y="180" width="500" height="50" rx="6"/>
  <text class="small" x="270" y="202" text-anchor="middle">不计费：FAILED / CANCELED 任务；平台侧原因（模型超时、供应商 5xx）的自动重试</text>
  <text class="small" x="270" y="218" text-anchor="middle">计费：用户手工发起的重抽，与首次生成同价</text>

  <rect class="box" x="560" y="180" width="460" height="50" rx="6"/>
  <text class="small" x="790" y="202" text-anchor="middle">充值不做线上支付：运营在管理端调整余额，必填备注并写 quota_change_log</text>
  <text class="small" x="790" y="218" text-anchor="middle">支付渠道不在本轮范围（见 PRODUCT_VISION 范围边界）</text>
</svg>

<p class="note">
  这条链路要守住的底线只有一条：创作者随时能回答「我这部剧花了多少钱、花在哪一集哪个镜头」。
  因此流水必须记到 shot_id 粒度，且单价必须快照——否则一次调价会让历史账单集体变脸。
</p>

</body>
</html>
