<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI 短剧制作平台原型 — 登录</title>
  <link rel="stylesheet" href="../assets/theme.css" />
  <link rel="stylesheet" href="../assets/liquid-glass.css" />
  <link rel="stylesheet" href="../assets/short.css" />
  <style>
    .login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
    .login-card { width: 380px; }
    .login-head { text-align: center; margin-bottom: 24px; }
    .login-mark { display: block; width: 56px; height: 56px; object-fit: contain; margin: 0 auto 12px; }
    .login-name { font-size: 20px; font-weight: 700; }
    .login-sub { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
  </style>
</head>
<body>
  <div class="login-wrap">
    <div class="card login-card">
      <div class="login-head">
        <img class="login-mark" src="../assets/bgss-mark.png" alt="" />
        <div class="login-name">AI 短剧制作平台 管理控制台</div>
        <div class="login-sub">Admin Console</div>
        <div style="margin-top:8px"><span class="badge">仅限管理员登录</span></div>
      </div>

      <!--
        对应接口：POST /bgssai/admin/login（用户端原型见 ../user/login.html）
        请求体：{ "login_type": "password", "identifier": "<账号>", "password": "<密码>" }
        成功 result：{ jwt_token, role_code, role_name, user_id, user_name, real_name }
        成功后跳转 /home（见 PAGE-FLOW.html）。
        法律页：管理端仅外链官网五页，不托管正文。需法务审阅。
      -->
      <div class="field">
        <label>账号 identifier</label>
        <input class="input" type="text" placeholder="请输入账号" />
      </div>
      <div class="field">
        <label>密码 password</label>
        <input class="input" type="password" placeholder="请输入密码" />
      </div>
      <button class="btn btn-block" onclick="location.href='home.html'">登 录</button>

      <div class="footer legal-fanout" style="margin-top:20px">
        <nav class="legal-fanout-links" aria-label="法律信息 Legal">
          <a href="https://www.bgssai.cn/legal/user-agreement" target="_blank" rel="noopener noreferrer">用户协议 / User Agreement</a>
          <a href="https://www.bgssai.cn/legal/privacy" target="_blank" rel="noopener noreferrer">隐私政策 / Privacy Policy</a>
          <a href="https://www.bgssai.cn/legal/children-privacy" target="_blank" rel="noopener noreferrer">儿童个人信息保护规则 / Children's Privacy</a>
          <a href="https://www.bgssai.cn/legal/third-party-sharing" target="_blank" rel="noopener noreferrer">第三方信息共享清单 / Third-Party Sharing</a>
          <a href="https://www.bgssai.cn/legal/personal-info-collection" target="_blank" rel="noopener noreferrer">个人信息收集清单 / Personal Information Collection</a>
        </nav>
        <div class="legal-fanout-copy">© 2026 昆山兵贵神速智能科技有限公司</div>
        <p class="legal-review-note">需法务审阅 · 管理端仅外链，不托管条款、不编造证照编号</p>
      </div>
    </div>
  </div>
</body>
</html>
