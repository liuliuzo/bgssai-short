<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI 短剧制作平台原型 — 登录</title>
  <link rel="stylesheet" href="../assets/theme.css" />
  <link rel="stylesheet" href="../assets/liquid-glass.css" />
  <link rel="stylesheet" href="../assets/short.css" />
  <style>
    .login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
    .login-card { width: 380px; }
    .login-head { text-align: center; margin-bottom: 24px; }
    .login-mark { display: block; width: 56px; height: 56px; object-fit: contain; margin: 0 auto 12px; }
    .login-name { font-size: 20px; font-weight: 700; }
    .login-sub { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
    .pw-field { position: relative; }
    .pw-field .input { width: 100%; box-sizing: border-box; padding-right: 42px; }
    .pw-toggle {
      position: absolute; top: 0; right: 0; height: 100%; width: 42px;
      display: inline-flex; align-items: center; justify-content: center;
      background: transparent; border: none; color: var(--text-muted); cursor: pointer; padding: 0;
    }
    .pw-toggle:focus-visible { outline: 2px solid #2563eb; outline-offset: -2px; border-radius: 6px; }
  </style>
</head>
<body>
  <div class="login-wrap">
    <div class="card login-card">
      <div class="login-head">
        <img class="login-mark" src="../assets/bgss-mark.png" alt="" />
        <div class="login-name">AI 短剧制作平台 管理控制台</div>
        <div class="login-sub">Admin Console</div>
        <div style="margin-top:8px"><span class="badge">仅限管理员登录</span></div>
      </div>

      <!--
        对应接口：POST /bgssai/admin/login（用户端原型见 ../user/login.html）
        请求体：{ "login_type": "password", "identifier": "<账号>", "password": "<密码>" }
        成功 result：{ jwt_token, role_code, role_name, user_id, user_name, real_name }
        成功后跳转 /home（见 PAGE-FLOW.html）。
        法律条款：管理控制台页脚统一链接至官网法律合规页面。
      -->
      <div class="field">
        <label>账号 identifier</label>
        <input class="input" type="text" placeholder="请输入账号" />
      </div>
      <div class="field">
        <label for="admin-password">密码 password</label>
        <div class="pw-field">
          <input id="admin-password" class="input" type="password" placeholder="请输入密码" autocomplete="current-password" />
          <button type="button" class="pw-toggle" aria-controls="admin-password" aria-pressed="false" aria-label="显示密码" onclick="toggleAdminPw(this)">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
              <circle cx="12" cy="12" r="3" />
            </svg>
          </button>
        </div>
        <p class="hint">默认掩码。点击按钮只在本页切换明文，不改变登录请求。</p>
      </div>
      <button class="btn btn-block" onclick="location.href='home.html'">登 录</button>

      <div class="footer legal-fanout" style="margin-top:20px">
        <nav class="legal-fanout-links" aria-label="法律信息 Legal">
          <span class="legal-fanout-pair"><a href="https://www.bgssai.com/terms-of-service/" target="_blank" rel="noopener noreferrer">服务条款</a><span aria-hidden="true"> / </span><a href="https://www.bgssai.com/en/terms-of-service/" target="_blank" rel="noopener noreferrer">Terms of Service</a></span>
          <span class="legal-fanout-pair"><a href="https://www.bgssai.com/privacy-policy/" target="_blank" rel="noopener noreferrer">隐私政策</a><span aria-hidden="true"> / </span><a href="https://www.bgssai.com/en/privacy-policy/" target="_blank" rel="noopener noreferrer">Privacy Policy</a></span>
          <span class="legal-fanout-pair"><a href="https://www.bgssai.com/personal-information-inventory/" target="_blank" rel="noopener noreferrer">个人信息收集清单</a><span aria-hidden="true"> / </span><a href="https://www.bgssai.com/en/personal-information-inventory/" target="_blank" rel="noopener noreferrer">Personal Information Inventory</a></span>
          <span class="legal-fanout-pair"><a href="https://www.bgssai.com/third-party-sharing/" target="_blank" rel="noopener noreferrer">第三方信息共享清单</a><span aria-hidden="true"> / </span><a href="https://www.bgssai.com/en/third-party-sharing/" target="_blank" rel="noopener noreferrer">Third-Party Sharing</a></span>
          <span class="legal-fanout-pair"><a href="https://www.bgssai.com/app-permissions/" target="_blank" rel="noopener noreferrer">应用权限说明</a><span aria-hidden="true"> / </span><a href="https://www.bgssai.com/en/app-permissions/" target="_blank" rel="noopener noreferrer">App Permissions</a></span>
        </nav>
        <div class="legal-fanout-copy">© 2026 昆山兵贵神速智能科技有限公司</div>
        <div class="legal-fanout-filing"><a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener noreferrer">苏ICP备2024070062号-15</a></div>
        <p class="legal-review-note">管理控制台仅限授权管理员账号登录</p>
      </div>
    </div>
  </div>
  <script>
    function toggleAdminPw(btn) {
      var input = document.getElementById('admin-password');
      var show = input.type === 'password';
      input.type = show ? 'text' : 'password';
      btn.setAttribute('aria-pressed', show ? 'true' : 'false');
      btn.setAttribute('aria-label', show ? '隐藏密码' : '显示密码');
      btn.innerHTML = show
        ? '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/></svg>'
        : '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
    }
  </script>
</body>
</html>
