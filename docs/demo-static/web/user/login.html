<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI 短剧制作平台原型 — 用户端登录</title>
  <link rel="stylesheet" href="../assets/theme.css" />
  <link rel="stylesheet" href="../assets/liquid-glass.css" />
  <link rel="stylesheet" href="../assets/short.css" />
  <style>
    .login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
    .login-card { width: 380px; }
    .login-head { text-align: center; margin-bottom: 24px; }
    .login-mark { display: block; width: 56px; height: 56px; object-fit: contain; margin: 0 auto 12px; }
    .login-name { font-size: 20px; font-weight: 700; }
    .login-sub { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
  </style>
</head>
<body>
  <div class="login-wrap">
    <div class="card login-card">
      <div class="login-head">
        <img class="login-mark" src="../assets/bgss-mark.png" alt="" />
        <div class="login-name">AI 短剧制作平台</div>
        <div class="login-sub">User App</div>
        <div style="margin-top:8px"><span class="badge">USER</span></div>
      </div>

      <!--
        对应接口：POST /bgssai/user/login（管理端原型见 ../admin/login.html）
        请求体：{ "login_type": "password", "identifier": "<账号>", "password": "<密码>" }
        成功 result：{ jwt_token, role_code, role_name, user_id, user_name, real_name }
        成功后跳转 /home（见 PAGE-FLOW.html）。
        法律页：登录区与页脚只外链官网五页，不托管正文。需法务审阅。
      -->
      <div class="field">
        <label>账号 identifier</label>
        <input class="input" type="text" placeholder="请输入账号" />
      </div>
      <div class="field">
        <label>密码 password</label>
        <input class="input" type="password" placeholder="请输入密码" />
      </div>
      <button class="btn btn-block" onclick="location.href='home.html'">登 录</button>

      <div class="footer legal-fanout" style="margin-top:20px">
        <nav class="legal-fanout-links" aria-label="法律信息 Legal">
          <span class="legal-fanout-pair"><a href="https://www.bgssai.com/terms-of-service/" target="_blank" rel="noopener noreferrer">服务条款</a><span aria-hidden="true"> / </span><a href="https://www.bgssai.com/en/terms-of-service/" target="_blank" rel="noopener noreferrer">Terms of Service</a></span>
          <span class="legal-fanout-pair"><a href="https://www.bgssai.com/privacy-policy/" target="_blank" rel="noopener noreferrer">隐私政策</a><span aria-hidden="true"> / </span><a href="https://www.bgssai.com/en/privacy-policy/" target="_blank" rel="noopener noreferrer">Privacy Policy</a></span>
          <span class="legal-fanout-pair"><a href="https://www.bgssai.com/personal-information-inventory/" target="_blank" rel="noopener noreferrer">个人信息收集清单</a><span aria-hidden="true"> / </span><a href="https://www.bgssai.com/en/personal-information-inventory/" target="_blank" rel="noopener noreferrer">Personal Information Inventory</a></span>
          <span class="legal-fanout-pair"><a href="https://www.bgssai.com/third-party-sharing/" target="_blank" rel="noopener noreferrer">第三方信息共享清单</a><span aria-hidden="true"> / </span><a href="https://www.bgssai.com/en/third-party-sharing/" target="_blank" rel="noopener noreferrer">Third-Party Sharing</a></span>
          <span class="legal-fanout-pair"><a href="https://www.bgssai.com/app-permissions/" target="_blank" rel="noopener noreferrer">应用权限</a><span aria-hidden="true"> / </span><a href="https://www.bgssai.com/en/app-permissions/" target="_blank" rel="noopener noreferrer">App Permissions</a></span>
        </nav>
        <div class="legal-fanout-copy">© 2026 昆山兵贵神速智能科技有限公司</div>

      </div>
    </div>
  </div>
</body>
</html>
