<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BGSSAI 短剧 — 登录</title>
<!-- 登录页真值原型（2026-09-26，Standards §14 / §15）。
     正式实现 bgssai-short-user-react/src/pages/login/Login.jsx；需求 docs/feature/login-page-cleanup-20260926.md；详设 docs/architecture/login-page-cleanup-20260926.md。
     右下角「原型演示」开关只在原型里用来演示「只画已开通渠道」，正式页面没有。 -->
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: Inter, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; color: #17283f; background: #f5f7fb; }
  .bot-nav { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px clamp(16px, 4vw, 48px); border-bottom: 1px solid rgba(128,128,128,.18); background: #fff; }
  .bot-nav strong { font-size: 14px; font-weight: 600; }
  .bot-nav a { min-height: 44px; display: inline-flex; align-items: center; padding: 10px 16px; border: 1px solid rgba(128,128,128,.3); border-radius: 8px; color: inherit; font-size: 13px; font-weight: 600; text-decoration: none; }
  .page { display: flex; justify-content: center; padding: 16px 16px 20px; }
  .card { width: 100%; max-width: 680px; background: #fff; border: 1px solid #e2e8f0; border-radius: 16px; padding: 14px 28px 12px; box-shadow: 0 12px 40px rgba(15,23,42,.06); }
  .brand { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-weight: 700; }
  .brand .lang { border: 1px solid #e2e8f0; background: #fff; border-radius: 8px; padding: 4px 10px; font-weight: 500; }
  .motion { height: 72px; margin: 0 0 4px; overflow: hidden; border-radius: 12px; background: radial-gradient(circle at 50% 50%, rgba(37,99,235,.14), transparent 60%); }
  h1 { font-size: 22px; margin: 0 0 10px; }
  .tabs { display: flex; gap: 4px; background: #f0f3f8; border-radius: 10px; padding: 4px; margin-bottom: 16px; }
  .tabs button { flex: 1; border: 0; background: none; padding: 10px 4px; border-radius: 7px; white-space: nowrap; font: inherit; font-size: 14px; color: #475569; }
  .tabs button[aria-selected="true"] { background: #fff; color: #2563eb; font-weight: 600; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; }
  .field { margin: 0 0 14px; }
  .row { display: flex; gap: 8px; }
  input { width: 100%; min-width: 0; padding: 11px 12px; border: 1px solid #cbd5e1; border-radius: 8px; font: inherit; }
  .row button { flex: 0 0 auto; padding: 0 14px; border: 1px solid #cbd5e1; border-radius: 8px; background: #fff; white-space: nowrap; }
  .phone-dial-field { display: flex; align-items: stretch; min-width: 0; padding: 0 8px 0 2px; border: 1px solid #cbd5e1; border-radius: 8px; background: #fff; }
  .phone-dial-combo { flex: 0 0 72px; max-width: 40%; position: relative; }
  .phone-dial-combo-trigger { width: 100%; min-height: 42px; display: inline-flex; align-items: center; justify-content: space-between; gap: 6px; margin: 0; padding: 0 4px 0 10px; border: 0; background: transparent; color: inherit; font: inherit; font-weight: 600; cursor: pointer; }
  .phone-dial-combo-caret { flex-shrink: 0; position: relative; width: 12px; height: 7px; opacity: .5; transition: transform .15s ease; }
  .phone-dial-combo-caret::before, .phone-dial-combo-caret::after { content: ""; position: absolute; top: 1px; width: 7.5px; height: 1.75px; background: currentColor; border-radius: 999px; }
  .phone-dial-combo-caret::before { left: 0; transform: rotate(38deg); transform-origin: right center; }
  .phone-dial-combo-caret::after { right: 0; transform: rotate(-38deg); transform-origin: left center; }
  .phone-dial-combo-trigger[aria-expanded="true"] .phone-dial-combo-caret { transform: rotate(180deg); }
  .phone-dial-divider { width: 1px; flex: 0 0 1px; align-self: stretch; margin: 10px 6px; background: currentColor; opacity: .16; }
  .phone-dial-number { flex: 1; min-width: 0; border: 0; background: transparent; outline: none; padding: 11px 4px; font: inherit; }
  .primary { width: 100%; padding: 12px; border: 0; border-radius: 8px; background: #2563eb; color: #fff; font-size: 15px; font-weight: 600; }
  .links { text-align: center; font-size: 13px; margin: 14px 0 0; }
  .links a { color: #2563eb; text-decoration: none; }
  .divider { display: flex; align-items: center; gap: 10px; color: #64748b; font-size: 13px; margin: 22px 0 14px; }
  .divider::before, .divider::after { content: ""; flex: 1; border-top: 1px solid #e2e8f0; }
  .oauth { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 8px; }
  .oauth button { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 9px 8px; border: 1px solid #e2e8f0; border-radius: 8px; background: #fff; white-space: nowrap; }
  .oauth img { width: 20px; height: 20px; object-fit: contain; }
  .consent { margin: 18px 0 0; text-align: center; font-size: 12px; color: #64748b; line-height: 1.6; }
  .consent a { color: #2563eb; text-decoration: none; }
  footer.legal-fanout {
    display: flex; justify-content: center; align-items: center;
    box-sizing: border-box; width: 100%; max-width: 100%;
    padding: 12px 16px 14px; text-align: center; font-size: 12px; font-weight: 400; line-height: 1.5;
    color: #8a93a6; border: 0; border-top: 1px solid #eceef3; background: transparent;
  }
  .legal-quiet-line { margin: 0; max-width: 100%; color: #8a93a6; font-size: 12px; font-weight: 400; line-height: 1.5; }
  footer.legal-fanout a { color: inherit; text-decoration: none; }
  footer.legal-fanout a:hover { color: #6d7688; text-decoration: none; }
  footer.legal-fanout a:focus-visible { outline: 2px solid #8a93a6; outline-offset: 2px; border-radius: 2px; }
  .legal-quiet-line a[href*="beian.miit.gov.cn"] { white-space: nowrap; }
  .demo { position: fixed; right: 12px; bottom: 12px; font-size: 12px; background: #fffbe6; border: 1px solid #faad14; border-radius: 8px; padding: 8px 10px; z-index: 40; }
  .demo input { width: auto; }
  @media (max-width: 480px) { .card { padding: 22px 18px; } }
  html[data-bgssai-shell="1"] .bot-nav { display: none; }
</style>
</head>
<body>
  <nav class="bot-nav" aria-label="BGSSAI Bot"><strong>BGSSAI Bot</strong><a href="/download/bot">下载</a></nav>
  <main class="page">
    <div class="card">
      <div class="brand"><span>BGSS <span style="font-weight:500;color:#64748b">短剧 Short</span></span></div>
      <div class="motion" aria-hidden="true"></div>
      <h1>欢迎回来</h1>
      <div class="tabs" role="tablist" aria-label="登录方式">
        <button type="button" role="tab" aria-selected="false" data-mode="password">密码</button>
        <button type="button" role="tab" aria-selected="false" data-mode="email">邮箱验证码</button>
        <button type="button" role="tab" aria-selected="true" data-mode="phone">手机验证码</button>
      </div>
      <form onsubmit="return false">
        <div data-panel="password" hidden>
          <div class="field"><label class="sr-only" for="a1">账号</label><input id="a1" placeholder="手机号 / 邮箱"></div>
          <div class="field"><label class="sr-only" for="w1">密码</label><input id="w1" type="password" placeholder="请输入密码"></div>
          <button class="primary" type="submit">登录</button>
        </div>
        <div data-panel="email" hidden>
          <div class="field"><label class="sr-only" for="e1">邮箱</label><input id="e1" type="email" placeholder="请输入邮箱地址"></div>
          <div class="field row"><label class="sr-only" for="c2">验证码</label><input id="c2" placeholder="6 位验证码" inputmode="numeric"><button type="button">获取验证码</button></div>
          <button class="primary" type="submit">登录 / 注册</button>
        </div>
        <div data-panel="phone">
          <div class="field"><label class="sr-only" for="p1">手机号</label>
            <div class="phone-dial-field">
              <div class="phone-dial-combo">
                <button type="button" class="phone-dial-combo-trigger" aria-label="国家区号" aria-expanded="false" aria-haspopup="listbox">
                  <span>+86</span><span class="phone-dial-combo-caret" aria-hidden="true"></span>
                </button>
              </div>
              <span class="phone-dial-divider" aria-hidden="true"></span>
              <input id="p1" class="phone-dial-number" placeholder="请输入手机号" inputmode="tel">
            </div>
          </div>
          <div class="field row"><label class="sr-only" for="c1">验证码</label><input id="c1" placeholder="6 位验证码" inputmode="numeric"><button type="button">获取验证码</button></div>
          <button class="primary" type="submit">登录 / 注册</button>
        </div>
      </form>
      <section id="oauth" aria-label="第三方账号登录">
        <p class="divider">第三方账号登录</p>
        <div class="oauth">
          <button type="button"><img src="../assets/brand/oauth/wechat.svg" alt="">微信</button>
          <button type="button"><img src="../assets/brand/oauth/douyin.svg" alt="">抖音</button>
          <button type="button"><img src="../assets/brand/oauth/baidu.svg" alt="">百度</button>
          <button type="button"><img src="../assets/brand/oauth/alipay.svg" alt="">支付宝</button>
          <button type="button"><img src="../assets/brand/oauth/bgssai.svg" alt="">用 Chat 登录</button>
        </div>
      </section>
      <p class="consent">登录或注册即表示已阅读并同意<a href="https://www.bgssai.com/terms-of-service/" target="_blank" rel="noopener noreferrer">《用户协议》</a>与<a href="https://www.bgssai.com/privacy-policy/" target="_blank" rel="noopener noreferrer">《隐私政策》</a></p>
    </div>
  </main>
  <footer class="legal-fanout legal-quiet">
    <p class="legal-quiet-line"><span>© 2026 昆山兵贵神速智能科技有限公司</span><span aria-hidden="true"> · </span><a href="https://www.bgssai.com/terms-of-service/" target="_blank" rel="noopener noreferrer">用户协议</a><span aria-hidden="true"> · </span><a href="https://www.bgssai.com/privacy-policy/" target="_blank" rel="noopener noreferrer">隐私政策</a><span aria-hidden="true"> · </span><a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener noreferrer">苏ICP备2024070062号-15</a></p>
  </footer>
  <label class="demo"><input type="checkbox" id="noChannels"> 原型演示：一个渠道都没开通</label>
  <script>
    var q = new URLSearchParams(location.search);
    if (q.get('bgssai_shell') === '1' || q.get('chat_pane') === '1') document.documentElement.dataset.bgssaiShell = '1';
    document.querySelectorAll('.tabs button').forEach(function (b) {
      b.onclick = function () {
        document.querySelectorAll('.tabs button').forEach(function (x) { x.setAttribute('aria-selected', x === b ? 'true' : 'false'); });
        document.querySelectorAll('[data-panel]').forEach(function (p) { p.hidden = p.dataset.panel !== b.dataset.mode; });
      };
    });
    document.getElementById('noChannels').onchange = function (e) { document.getElementById('oauth').hidden = e.target.checked; };
  </script>
</body>
</html>
