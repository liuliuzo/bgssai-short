bgssai.oauth.alipay.alipay-public-key=
bgssai.oauth.alipay.redirect-uri=http://www.bgssai-short.com/oauth-callback
bgssai.oauth.douyin.client-key=
bgssai.oauth.douyin.client-secret=
bgssai.oauth.douyin.redirect-uri=http://www.bgssai-short.com/oauth-callback
bgssai.oauth.weibo.client-id=
bgssai.oauth.weibo.client-secret=
bgssai.oauth.weibo.redirect-uri=http://www.bgssai-short.com/oauth-callback
