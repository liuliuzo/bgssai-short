# bgssai-short-drama-user — prod profile (application-prod.properties)
# 与 application-dev/-test/-prod.properties 保持完全一致的 key 集合，仅 value 随环境变化
# （Standards §1：分环境硬编码真实字面量，禁用属性占位符表达式）。
# 启动：SPRING_PROFILES_ACTIVE=prod（或 --spring.profiles.active=prod）。
# 本文件不含占位符、不含任何生产凭证：数据源与 jwt.secret 一律留空，由部署期
# /opt/bgssai/bgssai-short-drama-user/application-secrets.properties 注入生产真实值
# （--spring.config.import，见 deploy/README.md 与 docs/security/secrets-checklist.md）。
# jwt.secret 未注入时 JwtUtil 启动期 fail-fast（预期安全行为，杜绝弱密钥带病运行）；
# 生产值用 openssl rand -base64 48 生成，勿复用 dev/test 值。
#
# 已上移至 application.properties 主配置（三环境不变量）：spring.datasource.type

# --- 日志 ---
logging.config=classpath:log/logback-spring_file.xml
logging.applog.path=/opt/bgssai/log

# --- 数据源连接 (spring.datasource.*) ---
# 生产连接串与凭证绝不入 git，留空；由部署期 application-secrets.properties 注入。
spring.datasource.url=
spring.datasource.username=
spring.datasource.password=

# --- JWT ---
# 生产密钥绝不入 git，留空；未由 application-secrets.properties 注入时启动 fail-fast。
jwt.secret=
jwt.expiration-ms=86400000

# --- CORS ---
bgssai.cors.allowed-origins=https://app.example.com

# --- 三方授权登录（首次授权即自动建号）---
bgssai.oauth.mock-enabled=false
bgssai.oauth.wechat.app-id=
bgssai.oauth.wechat.app-secret=
bgssai.oauth.wechat.redirect-uri=https://app.example.com/oauth-callback
bgssai.oauth.alipay.app-id=
bgssai.oauth.alipay.app-private-key=
bgssai.oauth.alipay.alipay-public-key=
bgssai.oauth.alipay.redirect-uri=https://app.example.com/oauth-callback
bgssai.oauth.douyin.client-key=
bgssai.oauth.douyin.client-secret=
bgssai.oauth.douyin.redirect-uri=https://app.example.com/oauth-callback
bgssai.oauth.weibo.client-id=
bgssai.oauth.weibo.client-secret=
bgssai.oauth.weibo.redirect-uri=https://app.example.com/oauth-callback
