# bgssai-short-drama-user — prod profile (application-prod.properties)
# 与 application-dev/-test/-prod.properties 保持完全一致的 key 集合，仅 value 随环境变化
# （Standards §1：分环境硬编码真实字面量，禁用属性占位符表达式）。
# 启动：SPRING_PROFILES_ACTIVE=prod（或 --spring.profiles.active=prod）。
# 本文件不含占位符，按 Standards §1 全部写死本环境最终字面量并随 jar 打包，**无一项留空**：
# 数据源、jwt.secret 均随 jar 走，服务器上不需要放任何配置文件即可起服。
# application-secrets.properties 注入机制已停用（见 deploy/README.md 与 docs/security/secrets-checklist.md）。
#
# 生产用户端与 REDIS-境内共机（121.37.158.8 / 私有 172.31.15.78，www.bgssai-short.com），
# 走 8081 HTTP（Redis 占用 6379，不占 8081）。
#
# 已上移至 application.properties 主配置（三环境不变量）：spring.datasource.type

# --- 端口 ---
server.port=8081

# --- 日志 ---
logging.config=classpath:log/logback-spring_file.xml
logging.applog.path=/opt/bgssai/log

# --- 数据源连接 (spring.datasource.*) ---
# 境内生产库 172.31.4.181（VPC 私有地址，公网 121.36.230.185；两端共用同一个库 bgssai_short_drama）。
spring.datasource.url=jdbc:mysql://172.31.4.181:3306/bgssai_short_drama?useSSL=false&serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=2aB?fG9*nL

# --- JWT ---
# 按 Standards §1 写死本环境最终字面量（openssl rand -base64 48 生成，与 dev / test 及管理端不复用）。
# 留空或不足 32 字符会在 JwtUtil.configure 抛 IllegalStateException 使启动失败。
jwt.secret=8tzGIlqXvtcI9T-BrpIwMuGeR4m9FYs2ti7uIz6kIJZ_3keaIyRM-7Wmcp8z1mka
jwt.expiration-ms=86400000

# --- CORS ---
bgssai.cors.allowed-origins=http://www.bgssai-short.com:8081,http://www.bgssai-short.com,http://121.37.158.8:8081

# --- 三方授权登录（首次授权即自动建号）---
bgssai.oauth.mock-enabled=false
bgssai.oauth.wechat.app-id=
bgssai.oauth.wechat.app-secret=
bgssai.oauth.wechat.redirect-uri=http://www.bgssai-short.com/oauth-callback
