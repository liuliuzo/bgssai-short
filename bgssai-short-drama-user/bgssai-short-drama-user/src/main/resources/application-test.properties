# bgssai-short-drama-user — test profile (application-test.properties)
# 与 application-dev/-test/-prod.properties 保持完全一致的 key 集合，仅 value 随环境变化
# （Standards §1：分环境硬编码真实字面量，禁用属性占位符表达式）。
# 启动：SPRING_PROFILES_ACTIVE=test（或 --spring.profiles.active=test）。
# 数据库密码留空，由部署期 /opt/bgssai/bgssai-short-drama-user/application-secrets.properties 注入
# 测试环境真实凭证（见 deploy/README.md）。
#
# 已上移至 application.properties 主配置（三环境不变量）：spring.datasource.type

# --- 端口 / SSL ---
# test 档关闭 SSL、走 8081 明文（CI / 本地集成测试用），因此不加载 keystore；
# key-store / key-store-password 保持空值是刻意的（server.ssl.enabled=false 时不读这两项），
# 为与 dev / prod 保持 key 集合一致而保留键位。
server.port=8081
server.http.port=8081
server.ssl.enabled=false
server.ssl.key-store=
server.ssl.key-store-type=JKS
server.ssl.key-store-password=

# --- 日志 ---
logging.config=classpath:log/logback-spring_stdout.xml
logging.applog.path=/opt/bgssai/log

# --- 数据源连接 (spring.datasource.*) ---
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/bgssai_short_drama_test?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai
spring.datasource.username=bgssai_test
# 凭证不入库，留空；由部署期 application-secrets.properties 注入。
spring.datasource.password=

# --- JWT ---
jwt.secret=bgssai-short-drama-test-only-change-me-32bytes-minimum-secret
jwt.expiration-ms=86400000

# --- CORS ---
bgssai.cors.allowed-origins=http://localhost:3002,http://127.0.0.1:3002

# --- 三方授权登录（首次授权即自动建号）---
bgssai.oauth.mock-enabled=true
bgssai.oauth.wechat.app-id=
bgssai.oauth.wechat.app-secret=
bgssai.oauth.wechat.redirect-uri=http://127.0.0.1:3002/oauth-callback
bgssai.oauth.alipay.app-id=
bgssai.oauth.alipay.app-private-key=
bgssai.oauth.alipay.alipay-public-key=
bgssai.oauth.alipay.redirect-uri=http://127.0.0.1:3002/oauth-callback
bgssai.oauth.douyin.client-key=
bgssai.oauth.douyin.client-secret=
bgssai.oauth.douyin.redirect-uri=http://127.0.0.1:3002/oauth-callback
bgssai.oauth.weibo.client-id=
bgssai.oauth.weibo.client-secret=
bgssai.oauth.weibo.redirect-uri=http://127.0.0.1:3002/oauth-callback
