# bgssai-short-drama-admin — dev profile (application-dev.properties)
# 与 application-dev/-test/-prod.properties 保持完全一致的 key 集合，仅 value 随环境变化
# （Standards §1：分环境硬编码真实字面量，禁用属性占位符表达式）。
# 启动：SPRING_PROFILES_ACTIVE=dev（或 --spring.profiles.active=dev）。
# 远程开发机部署：与 Jenkins 控制器共机（101.44.189.190），Jenkins 占用 8080，本档走 8082 HTTP。
# 本机 IDE 若需沿用 8080：--server.port=8080
#
# 已上移至 application.properties 主配置（三环境不变量）：spring.datasource.type

# --- 端口 ---
server.port=8082

# --- 日志 ---
logging.config=classpath:log/logback-spring_file.xml
logging.applog.path=/opt/bgssai/log

# --- 数据源连接 (spring.datasource.*) ---
# 开发环境共享境外库 192.168.0.217（VPC 私有地址，公网 101.44.27.60）；库 bgssai_short_drama。
spring.datasource.url=jdbc:mysql://192.168.0.217:3306/bgssai_short_drama?serverTimezone=Asia/Shanghai&useSSL=false&useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_general_ci
spring.datasource.username=root
spring.datasource.password=2aB?fG9*nL

# --- JWT ---
# 本地开发占位密钥（>= 32 字符）；正式环境用 openssl rand -base64 48 重新生成，勿复用。
jwt.secret=bgssai-short-drama-dev-only-change-me-32bytes-minimum-secret
jwt.expiration-ms=86400000

# --- CORS ---
bgssai.cors.allowed-origins=http://localhost:3001,http://127.0.0.1:3001,http://dev.admin.bgssai-short.com:8082,http://dev.admin.bgssai-short.com,http://101.44.189.190:8082
