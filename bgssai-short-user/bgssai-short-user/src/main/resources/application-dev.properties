bgssai.idp.base-url=https://dev.user.bgssai-chat.cn
# BGSSAI TokenHub dual hub endpoints (keys in sys_secret only).
# DEV must use dev.user.* hubs: from short DEV host www.bgssai-tokenhub.cn TLS resets (Remote host terminated the handshake).
bgssai.llm.tokenhub-cn-base-url=https://dev.user.bgssai-tokenhub.cn
bgssai.llm.tokenhub-global-base-url=https://dev.user.bgssai-tokenhub.com
bgssai.llm.gateway-base-url=https://dev.user.bgssai-tokenhub.cn
bgssai.llm.default-model=deepseek-chat

