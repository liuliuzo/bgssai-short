# --- CORS ---
bgssai.cors.allowed-origins=http://localhost:3002,http://127.0.0.1:3002,https://dev.user.bgssai-short.com

# --- 三方授权登录（首次授权即自动建号）---
# AppID / Secret 走库（DML STEP LOGIN-OAUTH-1），不写 properties。
# redirect_uri 是环境相关回调，必须是前端 /oauth-callback。
bgssai.oauth.wechat.redirect-uri=http://127.0.0.1:3002/oauth-callback
bgssai.oauth.alipay.redirect-uri=http://127.0.0.1:3002/oauth-callback
bgssai.oauth.douyin.redirect-uri=http://127.0.0.1:3002/oauth-callback
bgssai.oauth.bgssai.redirect-uri=http://127.0.0.1:3002/oauth-callback
bgssai.idp.base-url=http://localhost:8080

# --- 支付沙箱 / 回调 ---
bgssai.payment.sandbox-enabled=true
bgssai.payment.notify-base-url=http://localhost:8080
bgssai.payment.order-timeout-minutes=30
bgssai.payment.wechat.sign-key=sandbox-wechat-sign-key
bgssai.payment.alipay.sign-key=sandbox-alipay-sign-key

