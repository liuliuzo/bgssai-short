# bgssai-short-user — local profile (application-local.properties)
# 与 application-local/-dev/-test/-prod.properties 保持完全一致的 key 集合，仅 value 随环境变化
# （Standards §1：分环境硬编码真实字面量，禁用属性占位符表达式）。
# 启动：SPRING_PROFILES_ACTIVE=local（或 --spring.profiles.active=local）。
# 本地笔记本启动：HTTP 8080，与 dev 一致，仅中间件走公网 IP（笔记本在 VPC 之外）。
# 本机 IDE 若需明文调试：--server.port=8081 --server.ssl.enabled=false
# 用户端与管理端共用同一个 MySQL 库（bgssai_short）。
#
# 已上移至 application.properties 主配置（四环境不变量）：spring.datasource.type

# 应用域名 = JKS 文件名（不含扩展名）：dev.user.bgssai-short.com

# --- 日志 ---
logging.config=classpath:log/logback-spring_stdout.xml
logging.applog.path=/opt/bgssai/log

