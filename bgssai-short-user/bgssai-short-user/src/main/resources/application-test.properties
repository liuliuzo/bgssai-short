# bgssai-short-user — test profile (application-test.properties)
# 与 application-local/-dev/-test/-prod.properties 保持完全一致的 key 集合，仅 value 随环境变化
# （Standards §1：分环境硬编码真实字面量，禁用属性占位符表达式）。
# 启动：SPRING_PROFILES_ACTIVE=test（或 --spring.profiles.active=test）。
# 数据库密码留空，由部署期 /opt/bgssai/bgssai-short-user/application-secrets.properties 注入
# 测试环境真实凭证（见 deploy/README.md）。
#
# 已上移至 application.properties 主配置（四环境不变量）：spring.datasource.type

# --- 端口 / SSL ---
# test 档关闭 SSL、走 8080 明文（CI / 本地集成测试用），因此不加载 keystore；
# key-store / key-store-password 保持空值是刻意的（server.ssl.enabled=false 时不读这两项），
# 为与 dev / prod 保持 key 集合一致而保留键位。
server.port=8080
server.http.port=8080
server.ssl.enabled=false
server.ssl.key-store=
server.ssl.key-store-type=JKS
server.ssl.key-store-password=

# --- 日志 ---
logging.config=classpath:log/logback-spring_file.xml
logging.applog.path=/opt/bgssai/log

# --- 数据源连接 (spring.datasource.*) ---
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/bgssai_short_test?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai
spring.datasource.username=bgssai_test
# 凭证不入库，留空；由部署期 application-secrets.properties 注入。
spring.datasource.password=

# --- JWT ---
jwt.secret=bgssai-short-test-only-change-me-32bytes-minimum-secret
jwt.expiration-ms=86400000

# --- CORS ---
bgssai.cors.allowed-origins=http://localhost:3002,http://127.0.0.1:3002

# --- 三方授权登录（首次授权即自动建号）---
# AppID / Secret 走库（DML STEP LOGIN-OAUTH-1），不写 properties。
# redirect_uri 是环境相关回调，必须是前端 /oauth-callback。
bgssai.oauth.wechat.redirect-uri=http://127.0.0.1:3002/oauth-callback
bgssai.oauth.alipay.redirect-uri=http://127.0.0.1:3002/oauth-callback
bgssai.oauth.douyin.redirect-uri=http://127.0.0.1:3002/oauth-callback

bgssai.oauth.baidu.redirect-uri=http://127.0.0.1:3002/oauth-callback
bgssai.oauth.bgssai.redirect-uri=http://127.0.0.1:3002/oauth-callback
bgssai.idp.base-url=https://test.bgssai-chat.cn
# 境内模型网关。短剧不配置境外中枢，也不在故障时改走境外。密钥只在 sys_secret。
bgssai.llm.tokenhub-cn-base-url=https://www.bgssai-tokenhub.cn
bgssai.llm.gateway-base-url=https://www.bgssai-tokenhub.cn
bgssai.llm.default-model=deepseek-chat

# --- 支付回调 ---
bgssai.payment.notify-base-url=http://localhost:8080
bgssai.payment.order-timeout-minutes=30

# --- 对象存储（华为云 OBS；中间件，一律 properties，不入库、不经 admin）---
bgssai.obs.endpoint=https://obs.cn-east-3.myhuaweicloud.com
bgssai.obs.access-key=HPUAXOAP6HPYVJJYF1WQ
bgssai.obs.secret-key=SQD0QPfTbOm1n7QrZcZ2rwb1SPk5iBtomqMi78Y5
# 当前无独立 test 环境，OBS 复用 dev 桶
bgssai.obs.bucket=dev-bgssai-short
bgssai.obs.region=cn-east-3
bgssai.obs.local-root=./data/obs-local
bgssai.obs.connect-timeout-ms=10000
bgssai.obs.socket-timeout-ms=30000
bgssai.obs.max-error-retry=2
bgssai.obs.public-base-url=https://dev-bgssai-short.obs.cn-east-3.myhuaweicloud.com

# --- Elasticsearch（测试不连集群，键与其它环境对齐）---
bgssai.elasticsearch.enabled=false
bgssai.elasticsearch.uris=https://101.44.26.151:9200
bgssai.elasticsearch.username=elastic
bgssai.elasticsearch.password=+qd+r1Ue=p=hcz131v+u
bgssai.elasticsearch.skip-tls-verification=true
bgssai.elasticsearch.index-prefix=short-test
bgssai.elasticsearch.connect-timeout-ms=2000
bgssai.elasticsearch.socket-timeout-ms=5000


# 成片发布调用 bgssai-tube-pc：POST /bgssai/user/tube/ingest/short
# token 占位；真实值走 Admin/sys_secret，禁止把密钥提交进仓库。
# 测试占位地址。主机未分配时不要改成虚构 IP；留空则发布诚实失败。
bgssai.tube.base-url=http://127.0.0.1:8090
bgssai.tube.ingest-token=

# --- Bot 安装包（不进 Git） ---
bgssai.bot.download.directory=/opt/bgssai/short/downloads/bot

