# bgssai-short-user — prod profile (application-prod.properties)
# 与 application-local/-dev/-test/-prod.properties 保持完全一致的 key 集合，仅 value 随环境变化
# （Standards §1：分环境硬编码真实字面量，禁用属性占位符表达式）。
# 启动：SPRING_PROFILES_ACTIVE=prod（或 --spring.profiles.active=prod）。
# 本文件不含占位符，按 Standards §1 全部写死本环境最终字面量并随 jar 打包，**无一项留空**：
# 数据源、jwt.secret、SSL keystore 口令均随 jar 走，服务器上不需要放任何配置文件即可起服。
# application-secrets.properties 注入机制已停用（见 deploy/README.md 与 docs/security/secrets-checklist.md）。
#
# 生产用户端与 EMQX-MQTT-境内共机（121.37.142.152 / 私有 172.31.1.81，www.bgssai-short.com）。
# Redis 占用 6379，不占 80/443。
#
# 已上移至 application.properties 主配置（四环境不变量）：spring.datasource.type

# --- 端口 / SSL（prod 明文 HTTP 8080；keystore 文件名仍用域名）---
server.port=8080
server.http.port=8080
server.ssl.enabled=false
server.ssl.key-store=classpath:www.bgssai-short.com.jks
server.ssl.key-store-type=JKS
server.ssl.key-store-password=Bf4,BAcaWUSucK*j

# 分机部署：HTTP 8080（SslConfig）。证书为 classpath 内置 JKS，口令见上方 server.ssl.key-store-password。

# --- 日志 ---
logging.config=classpath:log/logback-spring_file.xml
logging.applog.path=/opt/bgssai/log

# --- 数据源连接 (spring.datasource.*) ---
# 境内生产库 172.31.4.181（VPC 私有地址，公网 121.36.230.185；两端共用同一个库 bgssai_short）。
spring.datasource.url=jdbc:mysql://172.31.4.181:3306/bgssai_short?useSSL=false&serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=2aB?fG9*nL

# --- JWT ---
# 按 Standards §1 写死本环境最终字面量（openssl rand -base64 48 生成，与 dev / test 及管理端不复用）。
# 留空或不足 32 字符会在 JwtUtil.configure 抛 IllegalStateException 使启动失败。
jwt.secret=8tzGIlqXvtcI9T-BrpIwMuGeR4m9FYs2ti7uIz6kIJZ_3keaIyRM-7Wmcp8z1mka
jwt.expiration-ms=86400000

# --- CORS ---
bgssai.cors.allowed-origins=https://www.bgssai-short.com

# --- 三方授权登录（首次授权即自动建号）---
# AppID / Secret 走库（DML STEP LOGIN-OAUTH-1），不写 properties。
# redirect_uri 是环境相关回调，必须是前端 /oauth-callback。
bgssai.oauth.wechat.redirect-uri=https://www.bgssai-short.com/oauth-callback
bgssai.oauth.alipay.redirect-uri=https://www.bgssai-short.com/oauth-callback
bgssai.oauth.douyin.redirect-uri=https://www.bgssai-short.com/oauth-callback
bgssai.oauth.baidu.redirect-uri=https://www.bgssai-short.com/oauth-callback
bgssai.oauth.bgssai.redirect-uri=https://www.bgssai-short.com/oauth-callback
bgssai.idp.base-url=https://chat.bgssai.com
# Tokenhub 模型中枢（配齐后走中枢；未配则回退原厂）
bgssai.llm.gateway-base-url=https://www.bgssai-tokenhub-cn.com
bgssai.llm.gateway-api-key=sk-default-test-key
bgssai.llm.default-model=deepseek-v4-flash-0731-official

# --- 支付沙箱 / 回调 ---
bgssai.payment.sandbox-enabled=false
bgssai.payment.notify-base-url=https://www.bgssai-short.com
bgssai.payment.order-timeout-minutes=30
bgssai.payment.wechat.sign-key=sandbox-wechat-sign-key
bgssai.payment.alipay.sign-key=sandbox-alipay-sign-key

